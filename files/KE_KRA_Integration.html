<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRA TIMS Integration explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A57;--navy-deep:#06224A;--blue:#2563AB;--orange:#F47B20;--orange-deep:#D9601A;--gold:#FFB347;
  --bg:#F7F9FC;--surface:#FFFFFF;--ink:#1F2937;--muted:#5F6673;--line:#E5E7EB;
  --head:#0A2A57;--blue-soft:#DCE9F7;--orange-soft:#FCE4CC;--stop:#B4441B;--stop-soft:#FBE3D8;
  --ok:#1F7A5A;--ok-soft:#DDF1E8;--link:#2563AB;--dot3:#0A2A57;--shadow:0 1px 2px rgba(10,42,87,.06),0 4px 14px rgba(10,42,87,.06);
  --banner:linear-gradient(90deg,#06224A 0%,#0A2A57 35%,#2563AB 100%);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071B36;--surface:#0D2546;--ink:#E4EAF3;--muted:#A3B0C4;--line:#1F3B63;--head:#D6E4F7;
  --blue-soft:#15355F;--orange-soft:#3A2614;--stop:#FF9A6B;--stop-soft:#3A1F17;--ok:#6FD3AA;--ok-soft:#123A2D;--link:#8DBBF0;--dot3:#8FA3C0;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#071B36;--surface:#0D2546;--ink:#E4EAF3;--muted:#A3B0C4;--line:#1F3B63;--head:#D6E4F7;
  --blue-soft:#15355F;--orange-soft:#3A2614;--stop:#FF9A6B;--stop-soft:#3A1F17;--ok:#6FD3AA;--ok-soft:#123A2D;--link:#8DBBF0;--dot3:#8FA3C0;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Montserrat,"Open Sans","Segoe UI",Arial,sans-serif;color:var(--head);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.banner{background:var(--banner);color:#fff;display:flex;align-items:center;gap:20px;padding:14px clamp(16px,3vw,32px);min-height:76px}
.banner .t{flex:1;min-width:0}
.banner .sub{font-size:13px;opacity:.85}
.banner h1{color:#fff;font-size:clamp(19px,2.4vw,24px);line-height:1.2}
.banner .logo{height:40px;width:auto;display:block}
.ventas-tile{background:#fff;border-radius:8px;padding:7px 10px;display:flex;align-items:center}
.ventas-tile img{height:18px;width:auto;display:block}
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1280px;margin:0 auto;gap:28px;padding:24px clamp(12px,3vw,32px) 48px}
nav.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start}
.navgroup{margin-bottom:18px}
.navgroup h3{font-size:12px;color:var(--muted);font-family:"Open Sans",sans-serif;font-weight:600;margin:0 0 6px 10px}
.navbtn{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font-size:14.5px}
.navbtn:hover{background:var(--blue-soft)}
.navbtn[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--head)}
.navbtn[aria-current="page"]::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--orange);margin-left:-4px}
.navbtn .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mobile-nav{display:none}
main{min-width:0}
.lead{font-size:16.5px;max-width:72ch;color:var(--ink);margin:6px 0 22px}
.view-title{font-size:clamp(22px,2.6vw,28px);line-height:1.2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.accent-o{border-top:5px solid var(--orange)}
.accent-b{border-top:5px solid var(--blue)}
/* product picker on overview */
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.prod{padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top-width:5px}
.prod:hover{transform:translateY(-1px)}
.prod h2{font-size:17px}
.prod p{margin:0;color:var(--muted);font-size:14px}
.prod .go{margin-top:8px;font-weight:600;color:var(--link);font-size:14px}
/* matrix */
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.matrix th,.matrix td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
.matrix thead th{font-family:Montserrat,sans-serif;font-size:13.5px;color:#fff;background:var(--navy);padding:10px 12px;text-align:left}
.matrix thead th:first-child{border-top-left-radius:10px}.matrix thead th:last-child{border-top-right-radius:10px}
.matrix tbody th{font-weight:600;text-align:left;padding:10px 12px;font-size:14px;color:var(--head);width:18%}
.cellbtn{display:block;width:100%;height:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;font-size:14px}
.cellbtn:hover{background:var(--blue-soft)}
.cellbtn.shared{background:color-mix(in srgb,var(--blue-soft) 55%,transparent)}
.cellbtn.skip{color:var(--muted);font-style:italic}
.cellbtn small{display:block;color:var(--muted);font-size:12.5px;font-style:normal}
/* flow rail */
.tabs{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rail{display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}
.step{flex:1 0 128px;position:relative;background:none;border:0;cursor:pointer;padding:0 6px;text-align:center;scroll-snap-align:start}
.step::before{content:"";position:absolute;top:21px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .n{position:relative;z-index:1;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-weight:700;color:var(--muted);font-family:Montserrat,sans-serif;transition:background .15s,border-color .15s}
.step .l{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
.step .s{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.step.seen .n{border-color:var(--blue);color:var(--blue)}
.step.seen::before{background:var(--blue)}
.step[aria-current="step"] .n{background:var(--orange);border-color:var(--orange);color:#fff}
.step.auto .n{border-style:dashed}
.detail{padding:22px 24px;margin-top:6px}
.detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:14px}
.detail-head h2{font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill.status{background:var(--blue-soft);color:var(--head)}
.pill.who{background:var(--orange-soft);color:var(--ink)}
.sys{display:flex;gap:6px;flex-wrap:wrap}
.sys span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px}
.cols h3{font-size:14px;margin-bottom:6px}
.cols ul{margin:0;padding-left:18px}
.cols li{margin:3px 0}
.fail{background:var(--stop-soft);border-radius:8px;padding:12px 14px}
.fail h3{color:var(--stop)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-deep)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* tables */
.tbl{overflow-x:auto;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;background:var(--surface)}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:13.5px}
.tbl td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl code,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--blue-soft);padding:1px 5px;border-radius:4px;color:var(--head)}
.req{font-weight:700;color:var(--orange-deep)}
/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.controls{padding:20px}
.ctl{margin-bottom:16px;border:0;padding:0}
.ctl legend{font-weight:600;font-size:14px;color:var(--head);margin-bottom:6px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.ctl .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.ctl.off{opacity:.45}
.journey{padding:20px 22px}
.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.result .big{font-family:Montserrat,sans-serif;font-size:24px;font-weight:700}
.result .big.ok{color:var(--ok)}.result .big.bad{color:var(--stop)}.result .big.wait{color:var(--orange-deep)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);background:var(--surface);z-index:1}
.tl .done .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.tl .skip .mk{border-style:dashed;color:var(--muted)}
.tl .stop .mk{background:var(--stop);border-color:var(--stop);color:#fff}
.tl .wait .mk{border-color:var(--orange);color:var(--orange-deep)}
.tl .ttl{font-weight:600}
.tl .skip .ttl{color:var(--muted);font-weight:400}
.tl .why{font-size:13.5px;color:var(--muted)}
.tl .stop .why{color:var(--stop)}
.fired{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fired span{background:var(--orange-soft);border-radius:6px;padding:3px 9px;font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.tl li{animation:in .28s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* errors */
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input{flex:1 1 240px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.empty{padding:22px;color:var(--muted)}
/* integrations */
.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.int{padding:16px 18px;text-align:left;cursor:pointer;border-top-width:5px}
.int h3{font-size:16px;margin-bottom:4px}
.int p{margin:0;font-size:13.5px;color:var(--muted)}
.int[aria-pressed="true"]{outline:2px solid var(--orange)}
.conf{padding:16px 18px;margin-bottom:12px}
.conf h3{font-size:15px;margin-bottom:8px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs div{border-radius:8px;padding:10px 12px;font-size:14px}
.vs .b{background:var(--blue-soft)}.vs .l{background:var(--orange-soft)}
.vs strong{display:block;font-size:12.5px;margin-bottom:2px}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--orange)}
section.block{margin-top:30px}
section.block>h2{font-size:19px;margin-bottom:10px}
@media (max-width:1180px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:12px}
  nav.side{display:none}
  .mobile-nav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .mobile-nav select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface);color:var(--ink)}
  .sim{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
  .banner .ventas-tile{display:none}
}
@media (max-width:560px){.banner .logo{height:26px}.banner .sub{display:none}.banner{gap:10px}.theme-btn{padding:5px 8px;font-size:12px}.vs{grid-template-columns:1fr}.detail{padding:18px}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.kpi{padding:16px 18px}
.kpi .v{font-family:Montserrat,sans-serif;font-size:26px;font-weight:700;color:var(--head);line-height:1.1}
.kpi .k{font-size:13.5px;color:var(--muted);margin-top:4px}
.life{display:flex;gap:0;overflow-x:auto;padding:4px 2px 10px}
.life .st{flex:1 0 150px;text-align:center;position:relative;padding:0 8px}
.life .st::before{content:"";position:absolute;top:24px;left:-50%;right:50%;height:2px;background:var(--blue)}
.life .st:first-child::before{display:none}
.life .ic{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-family:Montserrat,sans-serif}
.life .st.out .ic{background:var(--orange)}
.life .nm{display:block;font-weight:600;margin-top:8px;font-size:14px}
.life .ds{display:block;font-size:12.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:minmax(120px,170px) 1fr 96px;gap:8px 14px;align-items:center;font-size:14px}
.bar{height:18px;border-radius:4px;background:var(--blue);min-width:3px}
.bars .q{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
textarea.code{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);resize:vertical}
.parts{display:flex;flex-wrap:wrap;gap:4px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:12px 0}
.parts button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 7px;cursor:pointer;font:inherit}
.parts button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.kv{display:grid;grid-template-columns:minmax(140px,200px) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--stop);font-weight:600}
.numin{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%;background:var(--surface);color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.facts div{background:var(--blue-soft);border-radius:8px;padding:10px 12px}
.facts strong{display:block;font-family:Montserrat,sans-serif;font-size:18px;color:var(--head)}
.facts span{font-size:12.5px;color:var(--muted)}
.diff td:nth-child(2){color:var(--muted)}
.diff td:nth-child(3){font-weight:600}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- KRA explorer additions ---- */
.seqwrap{overflow-x:auto}
.seq svg{display:block;min-width:720px;width:100%;height:auto}
.seq .msg{cursor:pointer}
.seq .msg:hover .lbl{fill:var(--orange-deep)}
.seq .msg.on .ln{stroke:var(--orange);stroke-width:2.5}
.seq .msg.on .lbl{fill:var(--orange-deep);font-weight:700}
.seqdetail{margin-top:12px;padding:14px 16px;border-radius:10px;background:var(--blue-soft);font-size:14px}
.seqdetail strong{color:var(--head)}
.dtree{display:grid;gap:10px}
.dnode{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dnode .q{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--blue-soft);color:var(--head);font-family:Montserrat,sans-serif}
.dnode.hit{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.dnode.hit .q{background:var(--orange);color:#fff}
.dnode.end{background:var(--ok-soft);border-color:transparent}
.dnode.end.err{background:var(--stop-soft)}
.dnode.end .q{background:var(--ok);color:#fff}
.dnode.end.err .q{background:var(--stop)}
.dnode.dim{opacity:.4}
.dnode h4{margin:0 0 2px;font-size:14.5px;color:var(--head);font-family:Montserrat,sans-serif}
.dnode p{margin:0;font-size:13.5px;color:var(--muted)}
.samples{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:20px;align-items:start}
.slist{display:grid;gap:10px;position:sticky;top:16px}
.sbtn{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;gap:3px;box-shadow:var(--shadow)}
.sbtn[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 4px 0 0 var(--orange),var(--shadow)}
.sbtn .t{font-weight:600;font-size:14px;color:var(--head)}
.sbtn .m{font-size:12.5px;color:var(--muted)}
.typetag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:6px}
.tt1{background:var(--blue-soft);color:var(--head)}
.tt2{background:var(--orange-soft);color:var(--orange-deep)}
.tt3{background:var(--ok-soft);color:var(--ok)}
.json{margin:0;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:560px;white-space:pre}
.json .k{color:var(--blue)}.json .s{color:var(--ok)}.json .n{color:var(--orange-deep)}
.json .hl{background:var(--orange-soft);border-radius:3px;outline:1px solid var(--orange)}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr{width:132px;height:132px;padding:8px;background:#fff;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.qr svg{width:116px;height:116px;display:block}
.qrtext a{color:var(--blue)}
#sd .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
#sd .facts strong{font-size:15px;overflow-wrap:anywhere}
.qrtext{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--ok)}
.checks .w .i{background:var(--orange)}
.calc input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.calc td{vertical-align:middle}
.calc .num{text-align:right;font-variant-numeric:tabular-nums}
.badge-ok{display:inline-block;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.samples{grid-template-columns:1fr}.slist{position:static}.vs2{grid-template-columns:1fr}}
.inv{max-width:520px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:18px 20px;font-size:13.5px}
.inv .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.inv hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
html.in-frame #themeBtn,html.in-frame .banner .logo{display:none!important}
</style>
<script>
(function(){var d=document.documentElement,K='kv-theme';
try{if(window.self!==window.top)d.classList.add('in-frame')}catch(e){d.classList.add('in-frame')}
var t=null;try{t=localStorage.getItem(K)}catch(e){}
if(t==='light'||t==='dark')d.setAttribute('data-theme',t);else if(!d.getAttribute('data-theme'))d.setAttribute('data-theme','light');
window.__kvApply=function(t){d.setAttribute('data-theme',t)};
window.kvSetTheme=function(t){window.__kvApply(t);try{localStorage.setItem(K,t)}catch(e){}
 var fr=document.querySelectorAll('iframe');for(var i=0;i<fr.length;i++){try{fr[i].contentWindow.postMessage({kvTheme:t},'*')}catch(e){}}};
window.kvToggleTheme=function(){window.kvSetTheme(d.getAttribute('data-theme')==='dark'?'light':'dark')};
window.addEventListener('storage',function(e){if(e.key===K&&e.newValue)window.__kvApply(e.newValue)});
window.addEventListener('message',function(e){if(e.data&&e.data.kvTheme)window.__kvApply(e.data.kvTheme)});
})();
</script>

html{zoom:.9}

.sixd-theme-btn,#themeBtn,.theme-btn,#themes,.themes,.topbar .seg[aria-label="Colour theme"]{display:none!important}

.navgroup{margin-bottom:12px!important}

/* ---------- reusable: sequence diagram ---------- */
function seq(host,parts,msgs){
 const W=760,top=56,row=50,colW=(W-40)/parts.length,H=top+msgs.length*row+30;
 const cx=i=>20+colW*i+colW/2;
 let on=0;
 function draw(){
  const lifelines=parts.map((p,i)=>`<g><rect x="${cx(i)-62}" y="10" width="124" height="32" rx="7" fill="var(--navy)"/><text x="${cx(i)}" y="31" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${esc(p)}</text><line x1="${cx(i)}" y1="42" x2="${cx(i)}" y2="${H-10}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/></g>`).join("");
  const ms=msgs.map((m,i)=>{const y=top+i*row+row/2,a=cx(m[0]),b=cx(m[1]),self=m[0]===m[1];
   const dash=m[4]?'stroke-dasharray="5 4"':"";
   const path=self?`M${a} ${y-8}h46v16h-42`:`M${a} ${y}H${b+(b>a?-6:6)}`;
   const lx=self?a+52:(a+b)/2,anchor=self?"start":"middle";
   return `<g class="msg ${i===on?"on":""}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(m[2])}"><rect x="20" y="${y-row/2}" width="${W-40}" height="${row}" fill="transparent"/>
    <path class="ln" d="${path}" fill="none" stroke="var(--blue)" stroke-width="1.6" ${dash} marker-end="url(#ah)"/>
    <circle cx="${self?a:Math.min(a,b)-0}" cy="${self?y-8:y}" r="0"/>
    <text class="lbl" x="${lx}" y="${self?y-14:y-8}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink)">${i+1}. ${esc(m[2])}</text></g>`}).join("");
  host.innerHTML=`<div class="seqwrap card detail seq"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sequence diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--blue)"/></marker></defs>${lifelines}${ms}</svg>
  <div class="seqdetail" aria-live="polite"><strong>Step ${on+1}: ${esc(msgs[on][2])}</strong><br>${msgs[on][3]}</div>
  <div class="navrow" style="border:0;padding-top:10px;margin-top:6px"><button class="btn" data-mv="-1" ${on===0?"disabled":""}>Previous step</button><button class="btn primary" data-mv="1" ${on===msgs.length-1?"disabled":""}>Next step</button></div></div>`;
  host.querySelectorAll(".msg").forEach(g=>{g.onclick=()=>{on=+g.dataset.i;draw()};g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();on=+g.dataset.i;draw()}}});
  host.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{on=Math.max(0,Math.min(msgs.length-1,on+ +b.dataset.mv));draw()});
 }
 draw();
}

V.flow=()=>{
 $("#view").innerHTML=`<h2 class="view-title">Integration flow</h2><p class="lead">USDM never talks to KRA directly. It calls the Airtel ESB, which forwards the invoice to a TIMS middleware device; the device answers immediately and reports to KRA later.</p>
 ${strip([["Connect","USDM, SV and ERP call the TIMS middleware through a JSON API"],["Validate","Middleware checks the tax information on the invoice"],["Respond","OK or Reject; on OK it returns a QR code URL"],["Print","USDM includes the QR code on the printed invoice"],["Report","Middleware sends an end-of-day report to KRA TIMS"]])}
 <section class="block"><h2>Systems involved</h2>${tbl(["System","Role"],[["<strong>USDM</strong>","Source system. Builds the invoice, stores the KRA reply and prints the QR. Uses sourceId <code>USDM</code>"],["<strong>SV, ERP, ERP-AM</strong>","Other Airtel source systems using the same API"],["<strong>Airtel ESB</strong>","Single entry point. Routes each invoice to a TIMS device and keeps the invoice-to-device mapping"],["<strong>TIMS middleware (Type C)</strong>","KRA-approved device that validates the invoice and generates the QR. Type C serves SV and USDM"],["<strong>KRA TIMS</strong>","KRA's Tax Information Management System; receives the end-of-day report"]])}</section>
 <section class="block"><h2>What comes back</h2><div class="cols">
  <div class="card detail accent-o"><h3>Middleware invoice number</h3><p>Returned as <code>antifakeCode</code>, e.g. <code>9990000010000000244</code>. Printed under the QR as <em>M/w No.</em> and used as <code>refrencedInvoiceNumber</code> on a later credit note.</p></div>
  <div class="card detail accent-b"><h3>QR code URL</h3><p>Returned as <code>qrCode</code>; it opens the invoice check page on the KRA iTax portal. USDM converts the URL into the printed QR code.</p></div>
  <div class="card detail accent-o"><h3>Device number</h3><p>Returned in <code>additionalParams</code> as <code>DEVICE_NUMBER</code> (middleware serial number). Printed as <em>M/w SN</em>.</p></div>
 </div></section>`;
};

/* ---------- device routing ---------- */
V.routing=()=>{
 $("#view").innerHTML=`<h2 class="view-title">Device routing</h2><p class="lead">Five TIMS devices are in use. Without knowing which device validated an invoice, a failed or retried posting could be sent to another device and validated twice. The approved fix: ESB records the device for every invoice and reuses it.</p>
 <div class="vs2">
  <div class="card detail accent-b"><h3>Solution 1 – store the device in each source system</h3>${ul(["ESB routes new invoices round-robin and returns the device to the source","SV, ERP and USDM each store it and send it back for retries, credit and debit notes","Replacing a device means updating every source system's data"])}</div>
  <div class="card detail accent-o"><h3>Solution 2 – store the device in ESB <span class="badge-ok">Approved</span></h3>${ul(["ESB routes round-robin and stores invoice number, server, created date, source system and status","Retries and credit/debit notes go to the same device automatically","ESB also returns the device; a source that sends it back skips the lookup","Records older than 7 months are purged; credit/debit notes need at least 6 months"])}</div>
 </div>
 <section class="block"><h2>Route a request</h2><p>Pick the request and see which way ESB sends it.</p>
 <div class="sim"><form class="card controls accent-o" id="rf" onsubmit="return false">
  ${seg("kind","Request",[["new","New invoice"],["retry","Retry"],["cn","Credit note"],["dn","Debit note"]],"new")}
  ${seg("dev","Device sent in the request?",[["no","No"],["yes","Yes"]],"no")}
  ${seg("found","Invoice already in the ESB table?",[["no","No"],["yes","Yes"]],"no")}
  ${seg("up","Original device available?",[["yes","Yes"],["no","No"]],"yes")}
 </form><div class="card journey accent-b"><div class="dtree" id="dt" aria-live="polite"></div></div></div></section>`;
 const f=$("#rf");
 const run=()=>{const v=Object.fromEntries(new FormData(f));const note=v.kind==="cn"||v.kind==="dn";
  const N=[];let end;
  N.push(["1","Request reaches ESB",`${({new:"New tax invoice",retry:"Retry of an invoice",cn:"Credit note",dn:"Debit note"})[v.kind]} from USDM`,"hit"]);
  if(v.dev==="yes"){N.push(["2","Device in the request?","Yes – ESB skips its own lookup","hit"]);end=["✓","Send to the device in the request","The source system stored the device and sent it back.",""];}
  else{N.push(["2","Device in the request?","No – ESB looks it up","hit"]);
   if(note){N.push(["3","Find the original invoice's device","Credit and debit notes must go to the device that validated the original invoice","hit"]);
    end=v.up==="yes"?["✓","Send to the original device","The note is validated on the same device as the invoice.",""]:["!","Error: original server is not available","ESB does not send the note to another device.","err"];}
   else{N.push(["3","Invoice found in the ESB table?",v.found==="yes"?"Yes – it was posted before":"No – first time ESB sees it","hit"]);
    end=v.found==="yes"?["✓","Send to the same device","Prevents the invoice being validated twice on two devices.",""]:["✓","Round-robin to the next device","ESB stores invoice number, device, date, source and status.",""];}}
  $("#f-found").classList.toggle("off",note||v.dev==="yes");$("#f-up").classList.toggle("off",!note||v.dev==="yes");
  $("#dt").innerHTML=N.map(n=>`<div class="dnode ${n[3]}"><span class="q">${n[0]}</span><div><h4>${n[1]}</h4><p>${n[2]}</p></div></div>`).join("")+`<div class="dnode end ${end[3]}"><span class="q">${end[0]}</span><div><h4>${end[1]}</h4><p>${end[2]}</p></div></div>`;};
 f.onchange=run;run();
};
function seg(name,label,opts,sel){return `<fieldset class="ctl" id="f-${name}"><legend>${label}</legend><div class="seg">${opts.map(o=>`<label><input type="radio" name="${name}" value="${o[0]}" ${o[0]===sel?"checked":""}><span>${o[1]}</span></label>`).join("")}</div></fieldset>`}

/* ---------- samples ---------- */
function hlJSON(o,mark){
 const s=JSON.stringify(o,null,2);
 return esc(s).replace(/(&quot;)([^&]*?)(&quot;)(\s*:)?/g,(m,a,b,c,d)=>{const cls=d?"k":"s";const hl=!d&&mark&&mark.includes(b)?" hl":"";return `<span class="${cls}${hl}">${a}${b}${c}</span>${d||""}`});
}
function checks(s){
 const r=s.req,g=r.goodsDetails,su=r.summary,out=[];const n=x=>parseFloat(x||0);
 const st=g.reduce((a,x)=>a+n(x.total),0);out.push([Math.abs(st-n(su.grossAmount))<0.05,`Sum of line totals ${fmt(st)} = grossAmount ${fmt(n(su.grossAmount))}`]);
 const tx=g.reduce((a,x)=>a+n(x.tax),0);out.push([Math.abs(tx-n(su.taxAmount))<0.015,`Sum of line tax ${fmt(tx)} vs taxAmount ${fmt(n(su.taxAmount))}${Math.abs(tx-n(su.taxAmount))>=0.005?" (rounding difference)":""}`]);
 const nt=n(su.grossAmount)-n(su.taxAmount);out.push([Math.abs(nt-n(su.netAmount))<0.015,`grossAmount − taxAmount ${fmt(nt)} vs netAmount ${fmt(n(su.netAmount))}`]);
 g.forEach(x=>{const inc=n(x.qty)*n(x.unitPrice)*(1+n(x.taxRate));out.push([Math.abs(inc-n(x.total))<0.05,`${esc(x.item)}: qty × unitPrice × 1.16 = ${fmt(inc)} matches total`])});
 out.push([s.res.status==="200","KRA status "+s.res.status+" "+s.res.message]);
 return out;
}

 const draw=()=>{
  document.querySelectorAll(".sbtn").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===cur));
  const s=SAMPLES[cur],b=s.req.basicInformation,su=s.req.summary,rb=s.res.response.basicInformation,rs=s.res.response.summary;
  const dev=((rs.additionalParams||{}).param||[]).find(p=>p.paramName==="DEVICE_NUMBER")||{};

  const ck=checks(s);
  $("#sd").innerHTML=`<div class="card detail accent-o">

  const body={
   sum:()=>`<div class="facts"><div><strong>${esc(b.invoiceNo)}</strong><span>USDM invoice number</span></div><div><strong>${esc(rb.antifakeCode)}</strong><span>middleware invoice no. (antifakeCode)</span></div><div><strong>${esc(dev.paramValue||"–")}</strong><span>TIMS device</span></div><div><strong>${esc(b.issuedDate)}</strong><span>issued</span></div></div>
    ${b.refrencedInvoiceNumber?`<p class="note">References original invoice <code>${esc(s.req.oriInvoiceNo||"")}</code> (middleware no. <code>${esc(b.refrencedInvoiceNumber)}</code>).</p>`:""}
    <div class="tbl" style="margin:14px 0"><table><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit price (excl. VAT)</th><th style="text-align:right">VAT</th><th style="text-align:right">Total (incl. VAT)</th></tr>
    ${s.req.goodsDetails.map(x=>`<tr><td>${esc(x.item)}</td><td style="text-align:right">${fmt(x.qty,0)}</td><td style="text-align:right">${fmt(x.unitPrice,2)}</td><td style="text-align:right">${fmt(x.tax)}</td><td style="text-align:right">${fmt(x.total)}</td></tr>`).join("")}
    <tr><td colspan="3"><strong>Net ${fmt(su.netAmount)} · VAT ${fmt(su.taxAmount)} · Discount ${fmt(su.discountTotal)}</strong></td><td></td><td style="text-align:right"><strong>${fmt(su.grossAmount)}</strong></td></tr></table></div>
    <div class="cols"><div><h3 style="font-size:14px;margin-bottom:8px">Checks</h3><ul class="checks">${ck.map(c=>`<li class="${c[0]?"":"w"}"><span class="i">${c[0]?"✓":"!"}</span><span>${c[1]}</span></li>`).join("")}</ul></div>
    <div><h3 style="font-size:14px;margin-bottom:8px">Printed on the invoice</h3><div class="qrbox"><div class="qr" id="qr"></div><div class="qrtext">M/w No.: ${esc(rb.antifakeCode)}<br>M/w SN: ${esc(dev.paramValue||"")}<br><a href="${esc(rs.qrCode)}" target="_blank" rel="noopener">Open KRA check page</a></div></div></div></div>`,
   req:()=>`<div class="navrow" style="border:0;margin:0 0 8px;padding:0"><span class="note" style="margin:0">POST /api/regulatory-service/v1/efris/invoice-upload</span><button class="btn" data-copy="req">Copy JSON</button></div><pre class="json">${hlJSON(s.req)}</pre>`,
   res:()=>`<div class="navrow" style="border:0;margin:0 0 8px;padding:0"><span class="note" style="margin:0">Highlighted: values USDM must store or print</span><button class="btn" data-copy="res">Copy JSON</button></div><pre class="json">${hlJSON(s.res,mark)}</pre>`
  };
  const drawTab=()=>{document.querySelectorAll("#sd [data-t]").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===tab));$("#tb").innerHTML=body[tab]();
   if(tab==="sum")drawQR($("#qr"),rs.qrCode);
   document.querySelectorAll("[data-copy]").forEach(c=>c.onclick=()=>{const t=JSON.stringify(c.dataset.copy==="req"?s.req:s.res,null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{c.textContent="Copied";setTimeout(()=>c.textContent="Copy JSON",1400)},()=>{})});};
  document.querySelectorAll("#sd [data-t]").forEach(x=>x.onclick=()=>{tab=x.dataset.t;store.set("kra-tab",tab);drawTab()});drawTab();
 };
 document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;store.set("kra-s",cur);draw()});draw();

 </div>`;
};
V.discount=()=>{
 let rows=[{n:"Item 1",p:100,q:10,d:0,ed:1},{n:"Item 2",p:20,q:5,d:0,ed:1},{n:"Item 3",p:1,q:10,d:100,ed:0}];
 $("#view").innerHTML=`<h2 class="view-title">Discount calculator</h2><p class="lead">KRA accepts only an invoice-level discount. The total item discount is spread across all lines as one percentage, which lowers every reported unit price. The example is the one in the requirement: a free item priced at KES 1 with 100% discount.</p>
 <div class="card detail accent-o calc"><div class="tbl"><table id="ct"></table></div>
  <div class="navrow" style="border:0;margin-top:8px;padding-top:0"><span><label for="edr" style="font-weight:600">Excise duty %</label> <input id="edr" type="number" value="12" step="0.5" style="width:80px;display:inline-block"> &nbsp; <label for="vr" style="font-weight:600">VAT %</label> <input id="vr" type="number" value="16" step="0.5" style="width:80px;display:inline-block"></span><button class="btn" id="add">Add line</button></div></div>
 <div id="cr"></div>
 <p class="note">Discount % = total item discount ÷ Σ (unit price × (1 + excise %) × qty). Reported unit price = unit price × (1 + excise %) × (1 − discount %).</p>`;
 const draw=()=>{const ed=+$("#edr").value/100,vr=+$("#vr").value/100;
  $("#ct").innerHTML=`<tr><th>Item</th><th>Unit price</th><th>Qty</th><th>Discount %</th><th>Excise applies</th><th></th></tr>`+rows.map((r,i)=>`<tr><td><input data-i="${i}" data-f="n" value="${esc(r.n)}" aria-label="Item name"></td><td><input data-i="${i}" data-f="p" type="number" value="${r.p}" step="0.01" aria-label="Unit price"></td><td><input data-i="${i}" data-f="q" type="number" value="${r.q}" aria-label="Quantity"></td><td><input data-i="${i}" data-f="d" type="number" value="${r.d}" min="0" max="100" aria-label="Discount percent"></td><td><input data-i="${i}" data-f="ed" type="checkbox" ${r.ed?"checked":""} style="width:auto" aria-label="Excise applies"></td><td><button class="btn" data-del="${i}" aria-label="Remove line">×</button></td></tr>`).join("");
  const base=rows.map(r=>r.p*(1+(r.ed?ed:0))*r.q),disc=rows.reduce((a,r)=>a+r.p*r.q*r.d/100,0),sumB=base.reduce((a,b)=>a+b,0),dp=sumB?disc/sumB:0;
  const rep=rows.map((r,i)=>{const up=r.p*(1+(r.ed?ed:0))*(1-dp),amt=up*r.q,v=amt*vr;return {n:r.n,up,q:r.q,amt,v,t:amt+v}});
  const tot=rep.reduce((a,x)=>({amt:a.amt+x.amt,v:a.v+x.v,t:a.t+x.t}),{amt:0,v:0,t:0});
  $("#cr").innerHTML=`<div class="facts"><div><strong>${fmt(disc)}</strong><span>total item discount (KES)</span></div><div><strong>${(dp*100).toFixed(3)}%</strong><span>invoice discount % applied to every line</span></div><div><strong>${fmt(tot.t)}</strong><span>reported total incl. VAT</span></div></div>
  <section class="block" style="margin-top:14px"><h2>Reported to KRA</h2>${tbl(["Item","Reported unit price","Qty","Amount","VAT","Total"],rep.map(x=>[esc(x.n),`<span class="num">${x.up.toFixed(4)}</span>`,x.q,fmt(x.amt),fmt(x.v),fmt(x.t)]).concat([["<strong>Total</strong>","","",`<strong>${fmt(tot.amt)}</strong>`,`<strong>${fmt(tot.v)}</strong>`,`<strong>${fmt(tot.t)}</strong>`]]))}</section>`;
  document.querySelectorAll("#ct input").forEach(inp=>inp.onchange=inp.oninput=()=>{const r=rows[+inp.dataset.i],f=inp.dataset.f;r[f]=f==="n"?inp.value:f==="ed"?(inp.checked?1:0):+inp.value;clearTimeout(draw.t);draw.t=setTimeout(()=>{const a=document.activeElement&&document.activeElement.dataset;const k=a?[a.i,a.f]:null;draw();if(k){const el=document.querySelector(`#ct input[data-i="${k[0]}"][data-f="${k[1]}"]`);if(el)el.focus()}},350)});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);draw()});
 };
 $("#add").onclick=()=>{rows.push({n:"Item "+(rows.length+1),p:10,q:1,d:0,ed:1});draw()};
 $("#edr").oninput=draw;$("#vr").oninput=draw;draw();
};
V.printing=()=>{
 const s=SAMPLES[0],rb=s.res.response.basicInformation,rs=s.res.response.summary,dev=rs.additionalParams.param[0].paramValue;
 $("#view").innerHTML=`<h2 class="view-title">Invoice printing</h2><p class="lead">Three changes to every printed invoice: the buyer's PIN, the KRA QR code with the middleware numbers under it, and a note for invoices printed before the QR is available.</p>
 <div class="vs2"><div>${ul(["Print the <strong>buyer PIN</strong> on the invoice","Convert the <code>qrCode</code> URL into a QR image","Under the QR, print <strong>M/w No.</strong> (antifakeCode) and <strong>M/w SN</strong> (DEVICE_NUMBER)","If the QR is not back yet, print \u201cQR code information available after sometime\u201d"])}</div>
 <div class="inv"><div class="row"><strong>Tax invoice ${esc(rb.invoiceNo)}</strong><span>${esc(rb.issuedDate)}</span></div><div class="row"><span>Buyer PIN</span><span>${esc(s.req.buyerDetails.buyerTin||"(not captured in sample)")}</span></div><hr>
 ${s.req.goodsDetails.map(x=>`<div class="row"><span>${esc(x.item)} × ${x.qty}</span><span>${fmt(x.total)}</span></div>`).join("")}<hr>
 <div class="row"><span>VAT 16%</span><span>${fmt(rs.taxAmount)}</span></div><div class="row"><strong>Total</strong><strong>KES ${fmt(rs.grossAmount)}</strong></div><hr>
 <div class="qrbox"><div class="qr" id="qr"></div><div class="qrtext">M/w No.: ${esc(rb.antifakeCode)}<br>M/w SN: ${esc(dev)}</div></div></div></div>
 <p class="note">Preview built from sample record \u201c${esc(s.title)}\u201d.</p>`;
 drawQR($("#qr"),rs.qrCode);
};
V.verify=()=>{
 const items=[["<code>total</code> is VAT-inclusive in USDM","In every sample, total = qty × unitPrice × 1.16 (e.g. 1 × 2155.17 → 2500). The API spec describes total as qty × unitPrice."],
  ["Primary Sale Return 1 is sent as a tax invoice","It uses invoiceType 1 with no referenced invoice, while Primary Sale Return 2 is a credit note (type 2) referencing the original. Confirm which is intended for returns."],
  ["Discount samples keep full unit prices","Primary Sale 2 and Return 1 send discountTotal (3,250 and 6) but unit prices are not reduced as the discount-conversion rule describes."],
  ["Rounding","Primary Sale Return 1: net 172.41 + tax 27.58 = 199.99 vs gross 200. POS Sale 1: line tax adds to 420.56 vs taxAmount 420.55."],
  ["Spec header sample","The REST curl example in the API spec sends ASP-OPCO: UG; Kenya calls use KE."],
  ["Sample file","The Primary Sale 2 response was missing a closing brace and the POS Sale 1 response had line-wrap gaps; both are cleaned in this explorer."]];
 const done=new Set(JSON.parse(store.get("kra-open")||"[]"));
 $("#view").innerHTML=`<h2 class="view-title">Points to verify</h2><p class="lead">Differences between the sample records and the specification. Ticks are saved in this browser only.</p>
 <div class="card detail"><ul class="check">${items.map((t,i)=>`<li><input type="checkbox" id="v${i}" ${done.has(i)?"checked":""}><label for="v${i}"><strong>${t[0]}</strong><br><span style="color:var(--muted)">${t[1]}</span></label></li>`).join("")}</ul></div>
 <p class="note">Device numbers in the samples alternate between ...000001 and ...000007, which matches round-robin routing.</p>`;
 document.querySelectorAll(".check input").forEach((c,i)=>c.onchange=()=>{c.checked?done.add(i):done.delete(i);store.set("kra-open",JSON.stringify([...done]))});
};

function drawQR(el,text){try{const q=qrcode(0,"M");q.addData(text);q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true});const s=el.querySelector("svg");if(s){s.setAttribute("width","116");s.setAttribute("height","116")}}catch(e){el.textContent="QR"}}
/* ---------- nav + theme ---------- */
function buildNav(){
 $("#sideNav").innerHTML=NAV.map(g=>`<div class="navgroup"><h3>${g.g}</h3>${g.items.map(i=>`<button class="navbtn" data-v="${i[0]}"><span class="dot" ${i[2]?`style="background:${i[2]}"`:""}></span>${i[1]}</button>`).join("")}</div>`).join("");
 $("#mSel").innerHTML=NAV.map(g=>`<optgroup label="${g.g}">${g.items.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join("")}</optgroup>`).join("");
 document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>show(b.dataset.v));$("#mSel").onchange=e=>show(e.target.value);
}
function show(v){if(!V[v])v="overview";document.querySelectorAll(".navbtn").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 $("#mSel").value=v;V[v]();store.set("kra-view",v);window.scrollTo({top:0,behavior:"auto"})}
$("#themeBtn").onclick=()=>{if(window.kvToggleTheme)kvToggleTheme();else{const d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark"}};
buildNav();show(store.get("kra-view")||"overview");
</script>
