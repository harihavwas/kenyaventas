<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCV Generation &amp; Printing explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A57;--navy-deep:#06224A;--blue:#2563AB;--orange:#F47B20;--orange-deep:#D9601A;--gold:#FFB347;
  --bg:#F7F9FC;--surface:#FFFFFF;--ink:#1F2937;--muted:#5F6673;--line:#E5E7EB;
  --head:#0A2A57;--blue-soft:#DCE9F7;--orange-soft:#FCE4CC;--stop:#B4441B;--stop-soft:#FBE3D8;
  --ok:#1F7A5A;--ok-soft:#DDF1E8;--link:#2563AB;--dot3:#0A2A57;--shadow:0 1px 2px rgba(10,42,87,.06),0 4px 14px rgba(10,42,87,.06);
  --banner:linear-gradient(90deg,#06224A 0%,#0A2A57 35%,#2563AB 100%);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071B36;--surface:#0D2546;--ink:#E4EAF3;--muted:#A3B0C4;--line:#1F3B63;--head:#D6E4F7;
  --blue-soft:#15355F;--orange-soft:#3A2614;--stop:#FF9A6B;--stop-soft:#3A1F17;--ok:#6FD3AA;--ok-soft:#123A2D;--link:#8DBBF0;--dot3:#8FA3C0;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#071B36;--surface:#0D2546;--ink:#E4EAF3;--muted:#A3B0C4;--line:#1F3B63;--head:#D6E4F7;
  --blue-soft:#15355F;--orange-soft:#3A2614;--stop:#FF9A6B;--stop-soft:#3A1F17;--ok:#6FD3AA;--ok-soft:#123A2D;--link:#8DBBF0;--dot3:#8FA3C0;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Open Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Montserrat,"Open Sans","Segoe UI",Arial,sans-serif;color:var(--head);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.banner{background:var(--banner);color:#fff;display:flex;align-items:center;gap:20px;padding:14px clamp(16px,3vw,32px);min-height:76px}
.banner .t{flex:1;min-width:0}
.banner .sub{font-size:13px;opacity:.85}
.banner h1{color:#fff;font-size:clamp(19px,2.4vw,24px);line-height:1.2}
.banner .logo{height:40px;width:auto;display:block}
.ventas-tile{background:#fff;border-radius:8px;padding:7px 10px;display:flex;align-items:center}
.ventas-tile img{height:18px;width:auto;display:block}
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1280px;margin:0 auto;gap:28px;padding:24px clamp(12px,3vw,32px) 48px}
nav.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start}
.navgroup{margin-bottom:18px}
.navgroup h3{font-size:12px;color:var(--muted);font-family:"Open Sans",sans-serif;font-weight:600;margin:0 0 6px 10px}
.navbtn{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font-size:14.5px}
.navbtn:hover{background:var(--blue-soft)}
.navbtn[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--head)}
.navbtn[aria-current="page"]::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--orange);margin-left:-4px}
.navbtn .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mobile-nav{display:none}
main{min-width:0}
.lead{font-size:16.5px;max-width:72ch;color:var(--ink);margin:6px 0 22px}
.view-title{font-size:clamp(22px,2.6vw,28px);line-height:1.2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.accent-o{border-top:5px solid var(--orange)}
.accent-b{border-top:5px solid var(--blue)}
/* product picker on overview */
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.prod{padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top-width:5px}
.prod:hover{transform:translateY(-1px)}
.prod h2{font-size:17px}
.prod p{margin:0;color:var(--muted);font-size:14px}
.prod .go{margin-top:8px;font-weight:600;color:var(--link);font-size:14px}
/* matrix */
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
.matrix th,.matrix td{padding:0;border-bottom:1px solid var(--line);vertical-align:top}
.matrix thead th{font-family:Montserrat,sans-serif;font-size:13.5px;color:#fff;background:var(--navy);padding:10px 12px;text-align:left}
.matrix thead th:first-child{border-top-left-radius:10px}.matrix thead th:last-child{border-top-right-radius:10px}
.matrix tbody th{font-weight:600;text-align:left;padding:10px 12px;font-size:14px;color:var(--head);width:18%}
.cellbtn{display:block;width:100%;height:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;font-size:14px}
.cellbtn:hover{background:var(--blue-soft)}
.cellbtn.shared{background:color-mix(in srgb,var(--blue-soft) 55%,transparent)}
.cellbtn.skip{color:var(--muted);font-style:italic}
.cellbtn small{display:block;color:var(--muted);font-size:12.5px;font-style:normal}
/* flow rail */
.tabs{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rail{display:flex;gap:0;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x proximity}
.step{flex:1 0 128px;position:relative;background:none;border:0;cursor:pointer;padding:0 6px;text-align:center;scroll-snap-align:start}
.step::before{content:"";position:absolute;top:21px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step .n{position:relative;z-index:1;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-weight:700;color:var(--muted);font-family:Montserrat,sans-serif;transition:background .15s,border-color .15s}
.step .l{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
.step .s{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.step.seen .n{border-color:var(--blue);color:var(--blue)}
.step.seen::before{background:var(--blue)}
.step[aria-current="step"] .n{background:var(--orange);border-color:var(--orange);color:#fff}
.step.auto .n{border-style:dashed}
.detail{padding:22px 24px;margin-top:6px}
.detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:14px}
.detail-head h2{font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill.status{background:var(--blue-soft);color:var(--head)}
.pill.who{background:var(--orange-soft);color:var(--ink)}
.sys{display:flex;gap:6px;flex-wrap:wrap}
.sys span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px}
.cols h3{font-size:14px;margin-bottom:6px}
.cols ul{margin:0;padding-left:18px}
.cols li{margin:3px 0}
.fail{background:var(--stop-soft);border-radius:8px;padding:12px 14px}
.fail h3{color:var(--stop)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-deep)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* tables */
.tbl{overflow-x:auto;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;background:var(--surface)}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:13.5px}
.tbl td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl code,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--blue-soft);padding:1px 5px;border-radius:4px;color:var(--head)}
.req{font-weight:700;color:var(--orange-deep)}
/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.controls{padding:20px}
.ctl{margin-bottom:16px;border:0;padding:0}
.ctl legend{font-weight:600;font-size:14px;color:var(--head);margin-bottom:6px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.ctl .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.ctl.off{opacity:.45}
.journey{padding:20px 22px}
.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.result .big{font-family:Montserrat,sans-serif;font-size:24px;font-weight:700}
.result .big.ok{color:var(--ok)}.result .big.bad{color:var(--stop)}.result .big.wait{color:var(--orange-deep)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);background:var(--surface);z-index:1}
.tl .done .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.tl .skip .mk{border-style:dashed;color:var(--muted)}
.tl .stop .mk{background:var(--stop);border-color:var(--stop);color:#fff}
.tl .wait .mk{border-color:var(--orange);color:var(--orange-deep)}
.tl .ttl{font-weight:600}
.tl .skip .ttl{color:var(--muted);font-weight:400}
.tl .why{font-size:13.5px;color:var(--muted)}
.tl .stop .why{color:var(--stop)}
.fired{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fired span{background:var(--orange-soft);border-radius:6px;padding:3px 9px;font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.tl li{animation:in .28s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* errors */
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input{flex:1 1 240px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.empty{padding:22px;color:var(--muted)}
/* integrations */
.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:24px}
.int{padding:16px 18px;text-align:left;cursor:pointer;border-top-width:5px}
.int h3{font-size:16px;margin-bottom:4px}
.int p{margin:0;font-size:13.5px;color:var(--muted)}
.int[aria-pressed="true"]{outline:2px solid var(--orange)}
.conf{padding:16px 18px;margin-bottom:12px}
.conf h3{font-size:15px;margin-bottom:8px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs div{border-radius:8px;padding:10px 12px;font-size:14px}
.vs .b{background:var(--blue-soft)}.vs .l{background:var(--orange-soft)}
.vs strong{display:block;font-size:12.5px;margin-bottom:2px}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--orange)}
section.block{margin-top:30px}
section.block>h2{font-size:19px;margin-bottom:10px}
@media (max-width:1180px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:12px}
  nav.side{display:none}
  .mobile-nav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .mobile-nav select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface);color:var(--ink)}
  .sim{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
  .banner .ventas-tile{display:none}
}
@media (max-width:560px){.banner .logo{height:26px}.banner .sub{display:none}.banner{gap:10px}.theme-btn{padding:5px 8px;font-size:12px}.vs{grid-template-columns:1fr}.detail{padding:18px}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.kpi{padding:16px 18px}
.kpi .v{font-family:Montserrat,sans-serif;font-size:26px;font-weight:700;color:var(--head);line-height:1.1}
.kpi .k{font-size:13.5px;color:var(--muted);margin-top:4px}
.life{display:flex;gap:0;overflow-x:auto;padding:4px 2px 10px}
.life .st{flex:1 0 150px;text-align:center;position:relative;padding:0 8px}
.life .st::before{content:"";position:absolute;top:24px;left:-50%;right:50%;height:2px;background:var(--blue)}
.life .st:first-child::before{display:none}
.life .ic{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-family:Montserrat,sans-serif}
.life .st.out .ic{background:var(--orange)}
.life .nm{display:block;font-weight:600;margin-top:8px;font-size:14px}
.life .ds{display:block;font-size:12.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:minmax(120px,170px) 1fr 96px;gap:8px 14px;align-items:center;font-size:14px}
.bar{height:18px;border-radius:4px;background:var(--blue);min-width:3px}
.bars .q{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
textarea.code{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);color:var(--ink);resize:vertical}
.parts{display:flex;flex-wrap:wrap;gap:4px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:12px 0}
.parts button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 7px;cursor:pointer;font:inherit}
.parts button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.kv{display:grid;grid-template-columns:minmax(140px,200px) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--stop);font-weight:600}
.numin{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%;background:var(--surface);color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.facts div{background:var(--blue-soft);border-radius:8px;padding:10px 12px}
.facts strong{display:block;font-family:Montserrat,sans-serif;font-size:18px;color:var(--head)}
.facts span{font-size:12.5px;color:var(--muted)}
.diff td:nth-child(2){color:var(--muted)}
.diff td:nth-child(3){font-weight:600}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

function flowViewer(host,steps){
 let i=0;const seen=new Set([0]);
 function draw(){
  const st=steps[i];
  host.innerHTML=`<div class="rail" role="tablist" aria-label="Steps">${steps.map((s,j)=>`<button class="step ${seen.has(j)?"seen":""} ${s.auto?"auto":""}" role="tab" aria-selected="${j===i}" ${j===i?'aria-current="step"':""} data-j="${j}"><span class="n">${j+1}</span><span class="l">${esc(s.t)}</span><span class="s">${esc(s.s)}</span></button>`).join("")}</div>
  <div class="card detail accent-${i%2?"b":"o"}" aria-live="polite">
   <div class="detail-head"><h2>${i+1}. ${esc(st.t)}</h2><span class="pill who">${esc(st.who)}</span><span class="pill status">Status: ${esc(st.status)}</span><div class="sys">${st.sys.map(x=>`<span>${x}</span>`).join("")}</div></div>
   <div class="cols"><div><h3>What happens</h3>${ul(st.what)}</div>${st.rules.length?`<div><h3>Rules</h3>${ul(st.rules)}</div>`:""}${st.fail.length?`<div class="fail"><h3>If it doesn't go through</h3>${ul(st.fail)}</div>`:""}</div>
   <div class="navrow"><button class="btn" data-mv="-1" ${i===0?"disabled":""}>Previous step</button><button class="btn primary" data-mv="1" ${i===steps.length-1?"disabled":""}>Next step</button></div>
  </div>
  <p class="note">Dashed circles are steps the system runs on its own.</p>`;
  host.querySelectorAll(".step").forEach(b=>b.onclick=()=>{i=+b.dataset.j;seen.add(i);draw();});
  host.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{i=Math.max(0,Math.min(steps.length-1,i+ +b.dataset.mv));seen.add(i);draw();host.querySelector('[aria-current="step"]').scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});});
  host.querySelector(".rail").onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){i=Math.max(0,Math.min(steps.length-1,i+(e.key==="ArrowRight"?1:-1)));seen.add(i);draw();host.querySelector('[aria-current="step"]').focus();}};
 }
 draw();
}

 let mode=store.get("rcv-sim")||"gen";
 $("#view").innerHTML=`<h2 class="view-title">Try a request</h2><p class="lead">Set up a generation or print request and see the steps it takes, how many files it produces and the expiry it gets.</p>
 <div class="tabs" role="tablist"><button class="tab" role="tab" data-m="gen">Generation request</button><button class="tab" role="tab" data-m="prt">Print request</button></div>
 <div class="sim"><form class="card controls accent-o" id="simf" onsubmit="return false"></form><div class="card journey accent-b" id="jr" aria-live="polite"></div></div>`;
 const seg=(name,label,opts,sel)=>`<fieldset class="ctl"><legend>${label}</legend><div class="seg">${opts.map(o=>`<label><input type="radio" name="${name}" value="${o[0]}" ${String(o[0])===String(sel)?"checked":""}><span>${o[1]}</span></label>`).join("")}</div></fieldset>`;
 function form(){
  document.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===mode));
  const def=mode==="gen"?1000000:250000;
  $("#simf").innerHTML=`${seg("den","Denomination (KES)",DENOMS.map(d=>[d,d]),"50")}
   <fieldset class="ctl"><legend><label for="qty">Quantity</label></legend><input class="numin" id="qty" name="qty" type="number" min="1" step="1000" value="${def}"><div class="hint">Limit: ${fmt(mode==="gen"?LIM.genMax:LIM.prtMax)} per request.</div></fieldset>
   ${seg("fin","Finance approver",[["approve","Approves"],["reject","Rejects"]],"approve")}
   ${mode==="prt"?seg("grn","Warehouse GRN quantity",[["match","Matches"],["short","Short"]],"match"):""}`;
  $("#simf").oninput=run;run();
 }
 function run(){
  const v=Object.fromEntries(new FormData($("#simf")));const q=Math.floor(+v.qty||0);const d=+v.den;const T=[];let end=null;
  const add=(st,t,w)=>T.push({st,t,w});const today=new Date();
  const max=mode==="gen"?LIM.genMax:LIM.prtMax;const per=mode==="gen"?LIM.genFile:LIM.prtFile;const files=Math.max(1,Math.ceil(q/per));
  if(q<1){add("stop",mode==="gen"?"Raise request":"Raise print request","Enter a quantity of at least 1");end=["bad","Not submitted","Quantity is missing."];}
  else if(q>max){add("stop",mode==="gen"?"Raise request":"Raise print request",`${fmt(q)} is over the ${fmt(max)} limit – split it into ${Math.ceil(q/max)} requests`);end=["bad","Not submitted","Over the request limit."];}
  else add("done",mode==="gen"?"Raise request":"Raise print request",mode==="gen"?`PING_ORD for ${fmt(q)} × KES ${d}`:`PRINT Order for ${fmt(q)} × KES ${d}; serials picked FIFO`);
  if(!end){
   add("done","Finance notified","Approver emailed about the pending request");
   if(v.fin==="reject"){add("stop","Finance approval",mode==="gen"?"Rejected – the order is cancelled":"Rejected – SCM reviews the reason and raises a new request");end=["bad",mode==="gen"?"Cancelled":"Rejected",mode==="gen"?"Nothing is sent to NGVS.":"Nothing goes to the printer."];}
   else add("done","Finance approval","Approved");
  }
  if(!end&&mode==="gen"){
   add("done","Sent to NGVS","Excel request emailed to the Ericsson team; order marked closed (async)");
   add("done","NGVS generates",`${files} encrypted file${files>1?"s":""} on SFTP (up to ${fmt(per)} each)`);
   add("done","Load inventory","USDM decrypts, matches denomination, card group, quantity and serials, then uploads");
   add("done","Close and notify","Received equals ordered – SCM and Finance emailed");
   end=["ok","Completed",`${fmt(q)} PINs in stock, ready to print.`];
  }
  if(!end&&mode==="prt"){
   add("done","Printer notified","Printing team emailed");
   add("done","Download file",`${files} file${files>1?"s":""} with OTP, decrypted with the vendor's own key`);
   add("done","Print and hand over","Vouchers printed and dispatched to the warehouse (offline)");
   if(v.grn==="short"){add("stop","GRN","Quantity doesn't match – GRN rejected (no partial GRN)");end=["wait","Awaiting GRN","Fix the quantity in ERP and redo the full GRN."];}
   else{add("done","GRN","Full quantity received in ERP");add("done","Ready for sale","Unavailable in Ericsson, Available in USDM; print request closed");end=["ok","Completed",`${fmt(q)} printed vouchers available to sell.`];}
  }
  const exp=addYears(today,mode==="gen"?LIM.genYears:LIM.prtYears);
  const mk={done:"✓",stop:"!",wait:"…"};
  $("#jr").innerHTML=`<div class="result"><span class="big ${end[0]}">${end[1]}</span><span>${end[2]}</span></div>
  <div class="facts" style="margin-bottom:16px"><div><strong>${q>0&&q<=max?files:"–"}</strong><span>${mode==="gen"?"NGVS files":"download files"}</span></div><div><strong>${dmy(exp)}</strong><span>${mode==="gen"?"PIN expiry if raised today":"printed expiry if raised today"}</span></div><div><strong>${pref(d)}</strong><span>denomination code in the file</span></div></div>
  <ol class="tl">${T.map(x=>`<li class="${x.st}"><span class="mk" aria-hidden="true">${mk[x.st]}</span><div><div class="ttl">${x.t}</div><div class="why">${x.w}</div></div></li>`).join("")}</ol>
  ${mode==="gen"&&q>500000&&q<=max?`<p class="note">Under the original requirement this request would have been capped at 500K, with files of 100K.</p>`:""}`;
 }
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.set("rcv-sim",mode);form();});
 form();
};

/* decoder */
const SAMPLE='sdpvouc_kcell.scratch1.create,end_date="16/01/2023",pin="48603",scnum="854852400",senum="000108205500011",SCRPREF="ZANSCR0010",SUSP_F="0";';
V.decoder=()=>{
 $("#view").innerHTML=`<h2 class="view-title">Voucher file decoder</h2><p class="lead">The vendor's print file is a .txt with one voucher per line. Paste lines below to see what each part means and whether it follows the format. Nothing leaves your browser.</p>
 <div class="card detail accent-o"><label for="ln" style="font-weight:600;color:var(--head)">Voucher lines</label><textarea class="code" id="ln" spellcheck="false">${esc(SAMPLE)}</textarea>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="smp" type="button">Reset to sample</button></div></div>
 <div id="dec" aria-live="polite"></div>
 <section class="block"><h2>Format rules</h2>${tbl(["Part","Meaning"],[["<code>sdpvouc_kcell.scratch1.create</code>","Constant prefix on every line"],["<code>end_date</code>","Expiry date printed on the voucher (dd/mm/yyyy)"],["<code>scnum</code> + <code>pin</code>","Joined in that order they form the 14-digit PIN"],["<code>senum</code>","Voucher serial number"],["<code>SCRPREF</code>","10 characters: prefix ZANSCR plus the denomination padded to 4 digits"],["<code>SUSP_F</code>","Always \"0\""]])}</section>`;
 const go=()=>{
  const lines=$("#ln").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){$("#dec").innerHTML=`<p class="empty">Paste at least one line.</p>`;return;}
  const out=lines.slice(0,50).map((l,i)=>{
   const g=k=>{const m=l.match(new RegExp(k+'="([^"]*)"'));return m?m[1]:null};
   const c={start:l.startsWith("sdpvouc_kcell.scratch1.create"),end:g("end_date"),pin:g("pin"),sc:g("scnum"),se:g("senum"),pr:g("SCRPREF"),su:g("SUSP_F")};
   const full=(c.sc||"")+(c.pin||"");const prOK=c.pr&&/^ZANSCR\d{4}$/.test(c.pr);const dOK=c.end&&/^\d{2}\/\d{2}\/\d{4}$/.test(c.end);
   const checks=[["Constant prefix",c.start],["14-digit PIN",/^\d{14}$/.test(full)],["Serial present",!!c.se],["Denomination code",prOK],["Expiry date format",!!dOK],["SUSP_F is 0",c.su==="0"]];
   return {i,c,full,den:prOK?+c.pr.slice(6):null,checks,ok:checks.every(x=>x[1])};
  });
  const first=out[0];
  $("#dec").innerHTML=`<section class="block"><h2>${out.length===1?"Decoded voucher":`Decoded ${out.length} vouchers`}</h2>
  ${out.length===1?`<div class="card detail ${first.ok?"accent-b":"accent-o"}"><dl class="kv">
   <dt>PIN (14 digits)</dt><dd><code>${esc(first.full||"–")}</code></dd><dt>Serial number</dt><dd><code>${esc(first.c.se||"–")}</code></dd>
   <dt>Denomination</dt><dd>${first.den!==null?`KES ${first.den}`:"–"}</dd><dt>Expiry printed</dt><dd>${esc(first.c.end||"–")}</dd>
   <dt>Checks</dt><dd>${first.checks.map(x=>`<span class="${x[1]?"ok":"bad"}">${x[1]?"✓":"✗"} ${x[0]}</span>`).join("<br>")}</dd></dl></div>`:
   tbl(["#","PIN","Serial","Denomination","Expiry","Result"],out.map(o=>[o.i+1,`<code>${esc(o.full||"–")}</code>`,`<code>${esc(o.c.se||"–")}</code>`,o.den!==null?`KES ${o.den}`:"–",esc(o.c.end||"–"),o.ok?'<span class="ok">Valid</span>':`<span class="bad">${o.checks.filter(x=>!x[1]).map(x=>x[0]).join(", ")}</span>`]))}
  ${lines.length>50?`<p class="note">Showing the first 50 of ${lines.length} lines.</p>`:""}</section>`;
 };
 $("#ln").oninput=go;$("#smp").onclick=()=>{$("#ln").value=SAMPLE;go();};go();
};

V.rules=()=>{
 $("#view").innerHTML=`<h2 class="view-title">Rules and limits</h2><p class="lead">The agreed solution values. Where they differ from the original requirement, see Requirement vs solution.</p>
 ${tbl(["Rule","Generation","Printing"],[["Raised by","SCM team","SCM team"],["Order type","<code>PING_ORD</code> (same as ePIN)","PRINT Order"],["Denominations per request","One denomination / card group","One denomination / card group"],["Max quantity per request","5,000,000","500,000"],["Max per file","500,000","500,000 records"],["Approver","Finance","Finance"],["On rejection","Order cancelled","SCM raises a new request"],["Expiry","PIN: 2 years from request (configurable)","Printed: 2 years from print request"],["Encryption","AES, same key as ePIN SFTP","Vendor's own public / private key"],["Serial selection","Generated by NGVS","FIFO from unprinted warehouse stock"],["Completion","Received quantity equals ordered","Full GRN in ERP"]])}
 <section class="block"><h2>Other rules</h2><div class="cols">
  <div class="card detail accent-o"><h3>Vendors and access</h3>${ul(["Printing vendors are created as internal users and log in through an internet URL","Downloads need an OTP, which the vendor can regenerate","The same file can be downloaded more than once"])}</div>
  <div class="card detail accent-b"><h3>Validation USDM does not do</h3>${ul(["ERP PO number is not checked against ERP, for open status, denomination or quantity","Print quantity is not checked against the PO quantity","PIN expiry and printed expiry come from separate processes and are not cross-checked"])}</div>
 </div></section>`;
};
V.changes=()=>{
 const rows=[["Max quantity per generation request","500,000","5,000,000"],["PIN expiry","3 years if denomination ≥ KES 250 (configurable), else 2 years","2 years (configurable)"],["Generation rejected by Finance","Back to SCM for corrective action","Order cancelled"],["Rejection reason","Appropriate reason (configurable)","Configurable, not mandatory"],["Max vouchers per NGVS file","100,000","500,000"],["Max records per print file","10,000","500,000"],["Printed voucher expiry","1 year from print request","2 years from print request"],["GRN","In ERP using the PO; system rejects mismatches","Existing USDM GRN screen as-is; ERP handles full-or-nothing"],["Approvals in sequence diagram","Commercial team, then Finance","Finance only (text)"]];
 $("#view").innerHTML=`<h2 class="view-title">Requirement vs solution</h2><p class="lead">The document holds the original business requirement and the impact analysis that answers it. These values changed; the rest of this explorer follows the solution column.</p>${tbl(["Topic","Original requirement","Agreed solution"],rows,"diff")}`;
};
V.reports=()=>{
 $("#view").innerHTML=`<h2 class="view-title">Search and reports</h2><p class="lead">Fields shown in the search results for each request type, and the report of serials still waiting to be printed.</p>
 <div class="cols">
  <div class="card detail accent-o"><h3>Generation request search</h3>${ul(["Request Number","Card Group","Product ID","Product Denomination","Start Serial Number","End Serial Number","Raised By","Approved By","Current Status","Quantity"])}</div>
  <div class="card detail accent-b"><h3>Print request search</h3>${ul(["Request Number","ERP PO Number","Card Group","Product ID","Product Denomination","Start Serial Number","End Serial Number","Raised By","Approved By","Current Status","Quantity"])}</div>
  <div class="card detail accent-o"><h3>Serials available for printing</h3>${ul(["Start Serial Number","End Serial Number","Card Group","Product ID","Product Denomination","RCV Generation Request Number","RCV Generation Request Date","RCV System Expiry Date"])}<p class="note">Too heavy to run live – a scheduled batch job refreshes it.</p></div>
 </div>
 <section class="block"><h2>Tables involved</h2>${tbl(["Module","Tables"],[["ARM","<code>ASSET_DETAILS</code>, <code>ASSET_RANGE_DETAILS</code>, <code>CUSTOM_FIELD_MAPPING</code>, <code>FILE_UPLOADS</code>, <code>PURCHASE_ORDER_MASTER</code>"],["POS","<code>POS_VOUCHER_ORDER_MASTER</code>, <code>POS_VOUCHER_ORDER_SERIAL_RANGE</code>"]])}</section>`;
};
V.volumes=()=>{
 const vol=[["100007050","Scratch Cards, 10",24000000],["100007054","Scratch Cards, 20",26000000],["100007049","Scratch Card, 50",8000000],["100007051","Scratch Cards, 100",2400000],["100007055","Scratch Cards, 250",80000],["100007057","Scratch Cards, 500",80000],["100007052","Scratch Cards, 1000",80000]];
 const max=26000000,tot=vol.reduce((a,v)=>a+v[2],0);
 $("#view").innerHTML=`<h2 class="view-title">Monthly volumes</h2><p class="lead">About ${(tot/1e6).toFixed(1)} million scratch cards a month, almost all of them KES 10 and KES 20.</p>
 <div class="card detail"><div class="bars">${vol.map(v=>`<span>${v[1]}<br><small style="color:var(--muted)">${v[0]}</small></span><div class="bar" style="width:${Math.max(.4,v[2]/max*100)}%" role="img" aria-label="${fmt(v[2])}"></div><span class="q">${fmt(v[2])}</span>`).join("")}</div></div>
 <div class="facts" style="margin-top:18px"><div><strong>${vol.reduce((a,v)=>a+Math.ceil(v[2]/LIM.genMax),0)}+</strong><span>generation requests a month at the 5M limit, since each request is one denomination</span></div><div><strong>${vol.reduce((a,v)=>a+Math.ceil(v[2]/LIM.prtMax),0)}+</strong><span>print requests a month at the 500K limit, one denomination each</span></div></div>
 <p class="note">Request counts are worked out from the volumes and limits; they are not in the source document.</p>`;
};
V.open=()=>{
 const items=["Names of the SCM requester, SCM approver and Finance approver roles","Business logic to link SFTP files to their generation request","Screen layout for the vendor's OTP download","How ERP shows the print request number on the GRN screen","Email on SFTP file arrival (success or failure)","At which stage generation notifications are sent"];
 const done=new Set(JSON.parse(store.get("rcv-open")||"[]"));
 $("#view").innerHTML=`<h2 class="view-title">Dependencies and open points</h2><p class="lead">Items the business still has to supply or decide. Ticks are saved in this browser only.</p>
 <div class="card detail"><ul class="check">${items.map((t,i)=>`<li><input type="checkbox" id="c${i}" ${done.has(i)?"checked":""}><label for="c${i}">${esc(t)}</label></li>`).join("")}</ul></div>
 <section class="block"><h2>Assumptions</h2><div class="card detail">${ul(["Generation is asynchronous, so the order is closed once Finance approves","PIN generation, SFTP placement, file format and keys stay the same as the live Kenya ePIN process","ePIN and RCV generation share one workflow and order type","The vendor is told about printed vouchers offline","GRN is done in ERP through the existing USDM screen"])}</div></section>`;
 document.querySelectorAll(".check input").forEach((c,i)=>c.onchange=()=>{c.checked?done.add(i):done.delete(i);store.set("rcv-open",JSON.stringify([...done]));});
};

function buildNav(){
 $("#sideNav").innerHTML=NAV.map(g=>`<div class="navgroup"><h3>${g.g}</h3>${g.items.map(i=>`<button class="navbtn" data-v="${i[0]}"><span class="dot" ${i[2]?`style="background:${i[2]}"`:""}></span>${i[1]}</button>`).join("")}</div>`).join("");
 $("#mSel").innerHTML=NAV.map(g=>`<optgroup label="${g.g}">${g.items.map(i=>`<option value="${i[0]}">${i[1]}</option>`).join("")}</optgroup>`).join("");
 document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>show(b.dataset.v));
 $("#mSel").onchange=e=>show(e.target.value);
}
function show(v){
 if(!V[v])v="overview";
 document.querySelectorAll(".navbtn").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
 $("#mSel").value=v;V[v]();store.set("rcv-view",v);window.scrollTo({top:0,behavior:"auto"});
}
(function(){const t=store.get("ps-theme");if(t)document.documentElement.dataset.theme=t;
 $("#themeBtn").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("ps-theme",n);};})();
buildNav();show(store.get("rcv-view")||"overview");
</script>
